version: 2.1

jobs:
  test:
    docker:
      - image: cimg/base:2025.01
    steps:
      - checkout
      - run:
          command: sudo apt-get update && sudo apt-get install curl openjdk-21-jdk-headless
      - run:
          command: curl -OL https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-amd64.deb
      - run:
          command: sudo dpkg -i bazelisk-amd64.deb
      - run:
          command: java -version
      - run:
          command: bazel --version
      - run:
          name: unit tests
          command: bazel test //...
      - run:
          name: example tests
          command: cd examples/simple && bazel test //...
      - run:
          # The extra flags BCR presubmit runs examples/simple with. Use these flags because BCR tests against them
          name: example tests (BCR incompatible flags)
          command: |
            cd examples/simple && bazel test //... \
              --incompatible_config_setting_private_default_visibility \
              --incompatible_disable_starlark_host_transitions \
              --incompatible_disable_native_repo_rules \
              --incompatible_autoload_externally= \
              --incompatible_strict_action_env
      - run:
          name: stress tests
          command: cd examples/stress && bazel test //...

  # Publishes the commit as vX.Y.N to the Bazel Central Registry. See RELEASING.md.
  publish-to-bcr:
    docker:
      - image: cimg/base:2025.01
    steps:
      - checkout
      - run:
          name: install bazelisk, gh and babashka
          command: |
            curl -fsSL https://github.com/babashka/babashka/releases/download/v1.12.215/babashka-1.12.215-linux-amd64-static.tar.gz \
              | sudo tar -xz -C /usr/local/bin bb
            bb --version
            curl -OL https://github.com/bazelbuild/bazelisk/releases/download/v1.25.0/bazelisk-amd64.deb
            sudo dpkg -i bazelisk-amd64.deb
            (type -p wget >/dev/null || sudo apt-get install -y wget) \
              && sudo mkdir -p -m 755 /etc/apt/keyrings \
              && wget -qO- https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo tee /etc/apt/keyrings/githubcli-archive-keyring.gpg > /dev/null \
              && sudo chmod go+r /etc/apt/keyrings/githubcli-archive-keyring.gpg \
              && echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null \
              && sudo apt-get update && sudo apt-get install -y gh
      - run:
          name: publish to BCR
          command: bb publish-to-bcr "$CIRCLE_SHA1"

workflows:
  test-workflow:
    jobs:
      - test:
          filters:
            branches:
              ignore: main
  release:
    jobs:
      - test:
          filters:
            branches:
              only: main
      - publish-to-bcr:
          requires:
            - test
          context: github-bazel-central-repo-publish
          # Publish one commit at a time, in order.
          serial-group: << pipeline.project.slug >>/publish-to-bcr
          filters:
            branches:
              only: main
